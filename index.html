 q.events.forEach(function(e){h+='<div class="ev'+(e.id==N?" new":"")+(LK==e.id?" lkon":"")+'" data-id="'+e.id+'" style="left:'+(e.x-BW)+'px;top:'+(ey(e)-BH)+'px"><div class="tl" data-e="t">'+esc(e.t)+'</div><div class="mm" data-e="m" data-ph="메모">'+esc(e.m||"")+'</div>'+(sub?"":'<div class="ft">'+(e.ep?e.ep+"화 ▸ 들어가기":"화 나누기 ▸")+'</div>')+'<div class="tools"><button data-a="l" title="화살표 연결">⇢</button><button data-a="d" title="삭제">×</button></div></div>'});
 w.innerHTML=h;N=0;

 w.querySelectorAll(".ev").forEach(function(el){

 });

function clrSel(){document.querySelectorAll(".ev.sel").forEach(function(x){x.classList.remove("sel")})}
function tapEv(ev,q,el,tg){
 if(LK){if(LK!=ev.id)q.links.push({a:LK,b:ev.id});LK=null;pers();rp();return}
 clrSel();el.classList.add("sel");
 var f=tg.closest("[data-e]");

function edit(f,ev,k){
 f.contentEditable="true";f.focus();

 f.onblur=function(){

  if(k=="t"){if(!v)v=ev.t;f.textContent=v;ev.t=v}else{ev.m=v;f.textContent=v}
  pers();
 };
}
function enter(ev){
 if(ev.ep){go(function(){P.push(ev)},1);return}
 ask({msg:"몇 화로 나눌까요?",type:"number",def:5},function(v){ev.ep=Math.max(1,Math.min(60,+v||1));ev.sc={events:[],links:[]};pers();go(function(){P.push(ev)},1)});
}
function rv(){var vp=$("pv");return{x:40,y:vp.clientHeight/2,k:Math.max(.55,Math.min(.8,(vp.clientWidth-80)/(800*zones().length)))}}
function go(fn,dir){
 var w=$("pw"),vp=$("pv"),v=PB.v,cx=(vp.clientWidth/2-v.x)/v.k,cyy=(vp.clientHeight/2-v.y)/v.k,k=v.k*(dir>0?3:.35);
 w.style.transition="transform .45s ease,opacity .45s";v.x=vp.clientWidth/2-cx*k;v.y=vp.clientHeight/2-cyy*k;v.k=k;PB.ap();w.style.opacity=0;
 setTimeout(function(){
  w.style.transition="none";fn();LK=null;rp();
  var T=rv(),f=dir>0?.3:2.5,c=[vp.clientWidth/2,vp.clientHeight/2];
  PB.v={x:c[0]-(c[0]-T.x)*f,y:c[1]-(c[1]-T.y)*f,k:T.k*f};PB.ap();void w.offsetWidth;

 },450);

  pers();rp();
 }
});
$("pb").onclick=function(){go(function(){P.pop()},-1)};
/* ---- 캐릭터 탭 ---- */
function rl(){
 var h="";
 S.rels.forEach(function(r,i){
  var A=S.chars.filter(function(c){return c.id==r.a})[0],Bc=S.chars.filter(function(c){return c.id==r.b})[0],a=$("c"+r.a),b=$("c"+r.b);if(!A||!Bc||!a||!b)return;
  var x1=A.x+105,y1=A.y+a.offsetHeight/2,x2=Bc.x+105,y2=Bc.y+b.offsetHeight/2,col=r.c||RC[r.t]||"#8a929e";
  h+='<line class="lk" data-i="'+i+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="4"/><text class="lk" data-i="'+i+'" x="'+(x1+x2)/2+'" y="'+(y1+y2)/2+'" fill="'+col+'" text-anchor="middle">'+esc(r.t)+'</text>';
 });
 $("csv").innerHTML=h;
}
function rg(){$("gl").innerHTML=S.groups.slice(1).map(function(g){return"<option>"+esc(g.n)+"</option>"}).join("")}
function grp(n){n=n.trim();if(!n)return 0;var i=-1;S.groups.forEach(function(g,k){if(g.n==n)i=k});if(i<0){S.groups.push({n:n,c:GP[S.groups.length%GP.length]});i=S.groups.length-1}return i}
function rc(){
 var h='<svg class="sv" id="csv"></svg>';
 S.chars.forEach(function(c){
  var g=S.groups[c.g]||S.groups[0];
  h+='<div class="ch'+(c.id==N?" new":"")+(LC==c.id?" lkon":"")+'" id="c'+c.id+'" style="left:'+c.x+'px;top:'+c.y+'px;--g:'+g.c+'"><div class="r1"><div class="av" data-a="img" style="background-image:url(\''+(c.img||"")+'\')">'+(c.img?"":"＋")+'</div><div class="r2"><input data-f="n" value="'+esc(c.n)+'" placeholder="이름"><div class="gr"><input data-f="gn" list="gl" value="'+(c.g?esc(g.n):"")+'" placeholder="소속"><input type="color" data-f="gc" value="'+g.c+'"'+(c.g?"":" disabled")+' title="소속 색상"></div></div></div><textarea data-f="info" rows="3" placeholder="기본 정보 (나이, 직업, 성격…)">'+esc(c.info)+'</textarea><div class="ft" data-a="det">'+(c.open?"▾ 자세히 접기":"▸ 자세히")+'</div><div class="tools"><button data-a="rel" title="관계 연결">⇢</button><button data-a="del" title="삭제">×</button></div>'+(c.open?'<div class="det"><b>'+esc(c.n||"캐릭터")+' 상세</b><textarea data-f="det" placeholder="외모, 과거, 능력, 비밀…">'+esc(c.det)+"</textarea></div>":"")+"</div>";
 });
 $("cw").innerHTML=h;N=0;rg();
 S.chars.forEach(function(c){
  var el=$("c"+c.id);
  drag(el,CB,function(){return{x:c.x,y:c.y}},function(x,y){c.x=x;c.y=y;el.style.left=x+"px";el.style.top=y+"px";rl()},function(){tapCh(c)},pers);
 });
 rl();
}
function tapCh(c){document.querySelectorAll(".ch.sel").forEach(function(x){x.classList.remove("sel")});var q=$("c"+c.id);if(q)q.classList.add("sel");
 if(!LC||LC==c.id)return;var a=LC;LC=null;hint();
 ask({msg:"두 캐릭터의 관계 (직접 입력 가능)",list:Object.keys(RC),col:true,c:"#8a929e"},function(v,cl){S.rels.push({a:a,b:c.id,t:v,c:(cl=="#8a929e"&&RC[v])?RC[v]:cl});pers();rc()});
}
function cof(e){var c=e.target.closest(".ch");return c&&S.chars.filter(function(x){return"c"+x.id==c.id})[0]}
var CB=Board($("cv"),$("cw"),".ch,button,.lk,select",function(){document.querySelectorAll(".ch.sel").forEach(function(x){x.classList.remove("sel")});if(LC){LC=null;hint();rc()}});
$("cw").addEventListener("input",function(e){
 var c=cof(e),f=e.target.dataset.f;if(!c||!f)return;
 if(f!="n"&&f!="info"&&f!="det")return;c[f]=e.target.value;pers();
 if(f=="n"&&c.open){var b=$("c"+c.id).querySelector(".det b");if(b)b.textContent=(c.n||"캐릭터")+" 상세"}
});
$("cw").addEventListener("change",function(e){
 var c=cof(e),f=e.target.dataset.f;if(!c)return;

});
$("cw").addEventListener("click",function(e){
 var l=e.target.closest(".lk");
 if(l){S.rels.splice(+l.dataset.i,1);pers();rl();return}
 var c=cof(e),b=e.target.closest("button,.av,.ft");if(!c||!b)return;var a=b.dataset.a;

});

/* ---- 글 탭 ---- */
function eps(){var a=[];S.plot.events.slice().sort(function(x,y){return x.x-y.x}).forEach(function(e){for(var i=1;i<=(e.ep||0);i++)a.push({k:e.id+"-"+i,t:e.t+" · "+i+"화"})});return a}

 }

/* ---- 탭/시작 ---- */
var inited=0;

 document.querySelectorAll(".pane").forEach(function(p,i){p.classList.toggle("on",i==n)});
 document.querySelectorAll("nav .it").forEach(function(b,i){b.classList.toggle("on",i==n)});

 if(n==0&&!(inited&1)){inited|=1;PB.v=rv();PB.ap()}
 if(n==1&&!(inited&2)){inited|=2;CB.v={x:40,y:70,k:1};CB.ap()}
 if(n==2)rw();
}
document.querySelectorAll("nav .it").forEach(function(b){b.onclick=function(){tab(+b.dataset.t)}});
function all(){rp();rc();rw();inited=0;tab(0)}
function show(on){$("login").hidden=on;$("nv").hidden=!on;$("app").hidden=!on}
function start(){
 show(true);try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(CK)||"{}"))}catch(e){}
 all();status("동기화 중…");pull();
}
$("login").onsubmit=async function(e){

 var r=await sb.auth.signInWithPassword({email:$("email").value,password:$("pass").value});
 if(r.error){$("err").textContent="로그인 실패: 이메일 또는 비밀번호를 확인하세요.";return}
 start();
};
$("out").onclick=async function(){await sb.auth.signOut();try{localStorage.removeItem(CK)}catch(e){}S=blank();show(false)};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!$("app").hidden)pull()});
window.addEventListener("online",function(){if(!$("app").hidden)pull()});
sb.auth.getSession().then(function(r){if(r.data.session)start();else show(false)});
})();
