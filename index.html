<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e5e7ea">
<title>글방 1.1.0</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<style>
:root{--bg:#e5e7ea;--p:#eceef0;--c:#f3f4f6;--l:#cdd1d7;--i:#2b2f35;--m:#6e7681;--a:#4b5563;--d:#3a3f47;--nav:#dcdfe3;--navc:#d1d5da;--navon:#d4d7dc;--sh1:#bfc3c9;--sh2:#f3f4f6;--shi1:#aeb3ba;--shi2:#f1f2f4;--dot:#b4bac3;--seg:#d6d9de;--dash:#b9bec6;--sel:#2563eb}
html.dark{--bg:#23262b;--p:#2b2f36;--c:#323740;--l:#454c57;--i:#e4e7ec;--m:#9ca3af;--a:#8f98a6;--d:#4b5362;--nav:#262a30;--navc:#1f2328;--navon:#22252b;--sh1:#191b1f;--sh2:#343a44;--shi1:#181a1e;--shi2:#353b45;--dot:#414854;--seg:#212429;--dash:#3b414b;--sel:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;left:0;right:0;top:0;height:var(--vh,100dvh);background:var(--bg);color:var(--i);font:15px/1.5 "Pretendard Variable","Pretendard","Noto Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;overflow:hidden;letter-spacing:-.01em}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit;border-radius:10px}
button{background:var(--c);border:1px solid var(--l);cursor:pointer;padding:6px 12px;min-height:34px;transition:background .15s,border-color .15s,transform .15s}
button:hover{border-color:var(--a)}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
nav{width:140px;background:var(--nav);border-right:1px solid var(--l);display:flex;flex-direction:column;flex-shrink:0}
.cell{flex:1;display:grid;place-items:center;border-bottom:2px dashed var(--dash);transition:background .3s}
.cell:last-child{border-bottom:0}
.cell:has(.it.on){background:var(--navc)}
nav .it{width:98px;height:98px;border-radius:50%;border:0;padding:0;background:var(--nav);color:var(--m);font-size:19px;font-weight:700;box-shadow:6px 6px 12px var(--sh1),-6px -6px 12px var(--sh2);transition:box-shadow .25s,color .25s,transform .2s}
nav .it:hover{color:var(--i)}
nav .it.on{color:var(--i);transform:scale(.93);background:var(--navon);box-shadow:inset 9px 9px 16px var(--shi1),inset -9px -9px 16px var(--shi2)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#hb{display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;align-items:center;gap:12px;min-height:46px;padding:4px 14px;background:var(--p);border-bottom:1px solid var(--l)}
#hl{grid-column:1;justify-self:start;min-width:0;max-width:100%}
#pbadge{font-size:13px;font-weight:700;color:var(--i);background:var(--c);border:1px solid var(--l);padding:4px 11px;min-height:30px;border-radius:999px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{text-align:center;font-size:13px;font-weight:500;grid-column:2}
#hr{grid-column:3;justify-self:end;white-space:nowrap;display:flex;align-items:center;gap:8px;color:var(--m);font-size:12px}
#panes{flex:1;position:relative;min-height:0}
.pane{position:absolute;inset:0;display:none}
.pane.on{display:flex;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#bd,#pm{position:absolute;inset:0}
.vp{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:default;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.7px);background-size:40px 40px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vp input,.vp textarea{-webkit-user-select:text;user-select:text}
.vp.panning{cursor:grabbing}
.selbox{position:absolute;border:1.5px solid var(--sel);background:rgba(37,99,235,.12);border-radius:4px;pointer-events:none;z-index:8}
.selbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--d);color:#f1f2f4;border-radius:999px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.22);white-space:nowrap}
.selbar button{min-height:28px;padding:2px 10px;border-radius:999px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:12px;font-weight:600}
.selbar button.del{background:#d64545}
.w{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.sv{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.sv .lk{pointer-events:visibleStroke;cursor:pointer}
.sv text{font-size:13px;font-weight:700;paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round;pointer-events:all;cursor:pointer}
.edge{position:absolute;border:2px dashed #8f97a3;border-radius:18px;pointer-events:none}
.pedge{position:absolute;left:0;top:-1000px;width:300000px;height:2000px;border-left:3px dashed #7b8390;border-top:2px dashed var(--l);border-bottom:2px dashed var(--l);pointer-events:none}
.zn{position:absolute;border-left:2px dashed var(--l);pointer-events:none}
.line{position:absolute;height:10px;border-radius:5px;background:var(--a);pointer-events:none}
.tb2{position:absolute;left:10px;top:48px;display:flex;gap:8px;align-items:center;z-index:5;max-width:calc(100% - 20px)}
.tb2 b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:6px 16px;min-height:36px;border-radius:9px;font-weight:600;color:var(--m)}
.seg button.on{background:var(--c);color:var(--i);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.zc{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:6}
.zc button{width:42px;height:42px;border-radius:50%;padding:0;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
#pmap{position:absolute;left:12px;bottom:12px;width:200px;height:90px;z-index:6;background:rgba(243,244,246,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--l);border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.14);overflow:hidden;cursor:crosshair;touch-action:none}
html.dark #pmap{background:rgba(43,47,54,.9)}
#pmap canvas{display:block;width:100%;height:100%}
#pmap span{position:absolute;left:6px;top:3px;font-size:10px;font-weight:700;color:var(--m);pointer-events:none}
.ev,.ch{position:absolute;background:var(--c);display:flex;flex-direction:column;touch-action:none}
.ev{--s:1;border:2px solid var(--a);border-radius:calc(14px*var(--s));padding:0 calc(8px*var(--s)) calc(6px*var(--s))}
.ev.sel,.ev:focus-within{border-color:var(--i);box-shadow:0 0 0 2px rgba(37,99,235,.28),0 4px 14px rgba(0,0,0,.14)}
.ch.sel,.ch:focus-within{box-shadow:0 0 0 3px rgba(37,99,235,.32),0 6px 18px rgba(0,0,0,.16)}
.gp{height:calc(16px*var(--s,1));flex:none;cursor:grab;position:relative}
.gp::after{content:"";position:absolute;left:50%;top:calc(6px*var(--s,1));width:calc(30px*var(--s,1));height:calc(4px*var(--s,1));margin-left:calc(-15px*var(--s,1));border-radius:2px;background:#b3b9c2}
html.dark .gp::after{background:#5d6573}
.ev input.tl{border:0;background:transparent;font-weight:700;font-size:max(calc(16px*var(--s)),calc(11px/var(--k,1)));line-height:1.3;width:100%;padding:2px 0;outline:none;text-overflow:ellipsis}
.ev textarea.mm{flex:1;min-height:0;border:0;background:transparent;font-size:calc(14px*var(--s));line-height:1.4;color:var(--m);resize:none;padding:2px 0;outline:none;width:100%}
.ev .ft,.ch .ft{flex:none;font-size:max(calc(13px*var(--s,1)),calc(10px/var(--k,1)));font-weight:700;color:var(--a);padding:4px 0 0;cursor:pointer}
.tools{z-index:2;position:absolute;top:-16px;right:-10px;display:flex;gap:4px;opacity:0;pointer-events:none;transition:opacity .15s}
.ev:hover .tools,.ev.sel .tools,.ch:hover .tools,.ch.sel .tools{opacity:1;pointer-events:auto}
.tools button{width:34px;height:34px;border-radius:50%;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.rz{position:absolute;width:28px;height:28px;right:-6px;bottom:-6px;cursor:nwse-resize;opacity:0;transition:opacity .15s;background:linear-gradient(135deg,transparent 52%,var(--a) 52%,var(--a) 62%,transparent 62%,transparent 76%,var(--a) 76%,var(--a) 86%,transparent 86%)}
.ev:hover .rz,.ev.sel .rz,.ch:hover .rz,.ch.sel .rz{opacity:.9}
.lkon{outline:2px dashed var(--a);outline-offset:4px}
.new{animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
#sb{position:absolute;left:0;right:0;top:0;height:44px;z-index:4;pointer-events:none}
#sb .sl{position:absolute;top:6px;height:34px;border:0;background:transparent;font-weight:700;font-size:18px;color:var(--m);padding:0 8px;border-radius:8px;pointer-events:auto;min-width:44px;min-height:0;outline-offset:0}
#sb button.sl:hover{background:rgba(128,128,128,.14)}
#sb input.sl:focus{background:var(--c);color:var(--i)}
#sb .dg{position:absolute;top:4px;width:30px;height:36px;margin-left:-15px;cursor:ew-resize;pointer-events:auto;border-radius:9px;background:var(--c);border:1px solid var(--l);display:grid;place-items:center;font-size:14px;color:var(--m);touch-action:none}
#sb .dg .dx{display:none;position:absolute;top:42px;left:50%;margin-left:-18px;width:36px;height:36px;border-radius:50%;padding:0;background:#d64545;border-color:#d64545;color:#fff}
#sb .dg.on .dx{display:block}
#adv{position:absolute;right:8px;top:5px;pointer-events:auto;font-weight:600}
#pmt{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);border-radius:0;padding:96px max(18px,calc((100% - 760px)/2)) 44px;font-size:16px;line-height:1.65;resize:none;outline:none}
#pmc{position:absolute;right:14px;bottom:8px;color:var(--m);font-size:12px;pointer-events:none}
#ac{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;padding:12px 44px;min-height:52px;border-radius:40px;font-size:20px;font-weight:700;background:var(--d);color:#f1f2f4;border-color:var(--d);box-shadow:0 6px 16px rgba(0,0,0,.18)}
#ac:active{transform:translateX(-50%) scale(.97)}
.ch{--s:1;border:3px solid var(--g);border-radius:calc(16px*var(--s));padding:0 calc(10px*var(--s)) calc(10px*var(--s))}
.r1{display:flex;gap:calc(8px*var(--s,1));flex:none;align-items:center}
.av{width:calc(56px*var(--s,1));height:calc(56px*var(--s,1));flex-shrink:0;background:var(--bg) center/cover;border:1px solid var(--l);border-radius:calc(14px*var(--s,1));display:grid;place-items:center;color:var(--m);font-size:calc(22px*var(--s,1));cursor:pointer}
.r2{display:flex;flex-direction:column;gap:calc(4px*var(--s,1));min-width:0;flex:1}
.ch input,.ch textarea,.det textarea{background:var(--p);border:1px solid var(--l);padding:calc(5px*var(--s,1)) calc(8px*var(--s,1));width:100%;min-width:0;border-radius:calc(8px*var(--s,1))}
.ch input.cnm{font-weight:700;font-size:max(calc(16px*var(--s,1)),min(calc(12px/var(--k,1)),calc(32px*var(--s,1))));line-height:1.3}
.gr{display:flex;gap:calc(5px*var(--s,1));margin-top:calc(6px*var(--s,1));align-items:stretch;flex:none}
.gnbox{position:relative;flex:1;min-width:0;background:var(--p);border:1px solid var(--l);border-radius:calc(8px*var(--s,1))}
.gnt{padding:calc(4px*var(--s,1)) calc(8px*var(--s,1));font-size:max(calc(13px*var(--s,1)),min(calc(10px/var(--k,1)),calc(24px*var(--s,1))));line-height:1.35;white-space:normal;word-break:break-word;overflow-wrap:anywhere;min-height:calc(28px*var(--s,1))}
.gnt.ph{color:var(--m)}
.gnbox input.gni{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;font-size:max(calc(13px*var(--s,1)),calc(11px/var(--k,1)));padding:calc(4px*var(--s,1)) calc(8px*var(--s,1))}
.gnbox:focus-within input.gni{position:relative;opacity:1;height:auto}
.gnbox:focus-within .gnt{display:none}
.gr input[type=color]{flex:0 0 calc(28px*var(--s,1));width:calc(28px*var(--s,1));min-height:calc(28px*var(--s,1));height:auto;padding:0;background:var(--c);border:1px solid var(--l);border-radius:calc(8px*var(--s,1));cursor:pointer}
.ch textarea{margin-top:calc(6px*var(--s,1));resize:none;flex:1;min-height:calc(40px*var(--s,1));font-size:calc(13.5px*var(--s,1));line-height:1.4}
.ch .ft{margin-top:calc(5px*var(--s,1))}
.det{position:absolute;top:-3px;width:270px;background:var(--c);border:3px solid var(--g);border-radius:16px;padding:10px;cursor:default;z-index:3}
.det textarea{height:200px;margin-top:6px;resize:vertical;font-size:14px}
.el{width:230px;border-right:1px solid var(--l);background:var(--p);overflow-y:auto;flex-shrink:0;padding:8px 0;-webkit-overflow-scrolling:touch}
.el-hd{display:none}
.er{width:270px;border-left:1px solid var(--l);background:var(--p);overflow-y:auto;flex-shrink:0;padding:8px 0;-webkit-overflow-scrolling:touch}
.ei{margin:3px 10px;padding:10px 14px;border-radius:12px;cursor:pointer}
.ei:hover{background:var(--bg)}
.ei.on{background:var(--l);font-weight:700}
.em{padding:16px;color:var(--m);font-size:13px}
.eh{margin:10px 14px 6px;font-size:12px;font-weight:700;color:var(--m)}
.cd{margin:6px 10px;padding:10px;border:2px solid var(--g);border-radius:14px;background:var(--c);cursor:pointer;font-size:12.5px}
.cd:hover{border-color:var(--i)}
.cd-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cd-av{width:40px;height:40px;flex-shrink:0;border-radius:10px;background:var(--bg) center/cover;border:1px solid var(--l);display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--m)}
.cd-meta{min-width:0;flex:1}
.cd-meta b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-meta small{display:block;font-size:11.5px;color:var(--m);white-space:normal;word-break:break-word}
.cd span{color:var(--m);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;white-space:pre-wrap}
.ed{flex:1;display:flex;flex-direction:column;min-width:0;padding:18px 28px 14px}
.ed-hd{display:flex;align-items:center;gap:10px;max-width:720px;width:100%;margin:0 auto 10px}
#ewb{display:none;flex:none;padding:5px 12px;min-height:34px;border-radius:10px;font-size:13px;font-weight:700}
.et{font-size:22px;font-weight:700;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mp{max-width:720px;width:100%;margin-inline:auto;max-height:170px;overflow-y:auto;background:var(--c);border:1px solid var(--l);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:13px;line-height:1.55;white-space:pre-wrap}
#mp .mt{font-weight:700;margin-top:4px}
#mp .mt:first-child{margin-top:0}
#ta{flex:1;max-width:720px;width:100%;margin-inline:auto;background:transparent;border:0;border-top:1px solid var(--l);border-radius:0;padding-top:14px;resize:none;outline:none;font-size:16px;line-height:1.65}
.cn{max-width:720px;width:100%;margin-inline:auto;color:var(--m);font-size:13px;border-top:1px solid var(--l);padding-top:8px;font-variant-numeric:tabular-nums}
#md,#setmd,#pwmd{position:fixed;inset:0;background:rgba(20,22,26,.48);display:grid;place-items:center;z-index:40}
.mb{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:22px;width:min(360px,92vw);animation:pop .2s;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.mb h2,.mb p{margin:0 0 12px;font-weight:700;font-size:17px}
#mi{display:flex;gap:8px;flex-wrap:wrap}
#mi input,#mi select,#mi textarea,.pwf input{background:var(--c);border:1px solid var(--l);padding:10px 12px;flex:1;min-width:0;font-size:15px;width:100%}
#mi input[type=color]{flex:0 0 44px;padding:2px}
.mbt{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.mbt button{min-height:40px;padding:6px 16px}
#mo,#login button[type=submit],#pnew,.btn-pri{background:var(--d);border-color:var(--d);color:#f1f2f4;font-weight:700}
#login{margin:auto;width:min(330px,90vw);display:flex;flex-direction:column;gap:10px}
#login h1{margin:0 0 6px}
#login input{background:var(--c);border:1px solid var(--l);padding:12px;font-size:16px}
#login button{padding:12px}
.btn-sub{background:transparent;border:1px solid var(--l);color:var(--m);font-size:14px;padding:9px 12px!important}
.btn-sub:hover{color:var(--i);border-color:var(--a)}
#err,.perr{color:#d64545;font-size:13px;min-height:18px}
.pok{color:#2f9e6e;font-size:13px;min-height:18px}
.set-list{display:flex;flex-direction:column;gap:10px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--c);border:1px solid var(--l);border-radius:12px}
.set-row b{font-size:14px;display:block}
.set-row small{font-size:12px;color:var(--m);display:block}
.tgl{width:48px;height:28px;border-radius:999px;background:var(--l);border:0;padding:3px;position:relative;min-height:0;flex-shrink:0;transition:background .2s}
.tgl::after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on{background:#3b82f6}
.tgl.on::after{transform:translateX(20px)}
.set-act{width:100%;text-align:left;padding:11px 14px;font-weight:600;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.set-act.danger{color:#d64545;border-color:rgba(214,69,69,.35)}
.pwf{display:flex;flex-direction:column;gap:8px}
.pw-sep{border-top:1px dashed var(--l);margin:8px 0;padding-top:10px;display:flex;flex-direction:column;gap:8px}
.pw-sep small{color:var(--m);font-size:12px}
/* 프로젝트 관리 화면 */
#proj{position:fixed;inset:0;background:var(--bg);z-index:25;display:flex;flex-direction:column;overflow:hidden}
.pjh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(12px,env(safe-area-inset-top)) 18px 12px;background:var(--p);border-bottom:1px solid var(--l)}
.pjh-l{display:flex;align-items:center;gap:10px;min-width:0}
.pjh-l h2{margin:0;font-size:19px;white-space:nowrap}
.pjh-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pjb{flex:1;overflow-y:auto;padding:22px 18px 40px;-webkit-overflow-scrolling:touch}
.pjin{max-width:740px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pjtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pjtop span{color:var(--m);font-size:13px}
#plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--c);border:1.5px solid var(--l);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.pcard:hover{border-color:var(--a);box-shadow:0 6px 18px rgba(0,0,0,.09);transform:translateY(-1px)}
.pcard.cur{border-color:var(--sel);box-shadow:0 0 0 2px rgba(59,130,246,.22)}
.pcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pcard-top b{font-size:16px;line-height:1.35;word-break:break-word}
.pcard-tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sel);color:#fff;flex-shrink:0}
.pcard-meta{font-size:12px;color:var(--m)}
