 else ask({msg:"몇 화로 나눌까요?",type:"number",def:5},function(v){ev.ep=Math.max(1,Math.min(60,+v||1));ev.sc={events:[],links:[]};pers();go(function(){P.push(ev)},1)});
}
function editT(ev){ask({msg:"사건 제목·메모",def:ev.t,memo:ev.m||""},function(v,c,m){ev.t=v;ev.m=m||"";pers();rp()})}
function rv(){var vp=$("pv");return{x:40,y:vp.clientHeight/2,k:Math.max(.3,Math.min(.8,(vp.clientWidth-80)/(800*zones().length)))}}
function go(fn,dir){
 var w=$("pw"),vp=$("pv"),v=PB.v,cx=(vp.clientWidth/2-v.x)/v.k,cy=(vp.clientHeight/2-v.y)/v.k,k=v.k*(dir>0?3:.35);
 w.style.transition="transform .45s ease,opacity .45s";v.x=vp.clientWidth/2-cx*k;v.y=vp.clientHeight/2-cy*k;v.k=k;PB.ap();w.style.opacity=0;
 setTimeout(function(){
  w.style.transition="none";fn();rp();LK=null;
  var T=rv(),f=dir>0?.3:2.5,c=[vp.clientWidth/2,vp.clientHeight/2];
  PB.v={x:c[0]-(c[0]-T.x)*f,y:c[1]-(c[1]-T.y)*f,k:T.k*f};PB.ap();void w.offsetWidth;
  w.style.transition="transform .45s ease,opacity .45s";PB.v=T;PB.ap();w.style.opacity=1;
 },450);
}
var PB=Board($("pv"),$("pw"),".ev,button,.lk",function(x,y,t){
 if(LK){LK=null;hint();rp();return}
 if(t&&t.closest&&t.closest(".hit")){var s=scope(),W=800*zones().length,e={id:++S.u,x:Math.max(40,Math.min(W-40,x)),s:y<0?-1:1,t:"새 사건",m:"",ep:0};s.events.push(e);N=e.id;pers();rp()}
});
$("pw").addEventListener("click",function(e){
 var s=scope(),b=e.target.closest("button"),l=e.target.closest(".lk");
 if(l){if(confirm("이 화살표를 삭제할까요?")){s.links.splice(+l.dataset.i,1);pers();rp()}return}
 if(!b)return;
 if(b.dataset.w){openW(P[P.length-1].id+"-"+b.dataset.w);return}
 var el=b.closest(".ev"),ev=s.events.filter(function(x){return x.id==el.dataset.id})[0];
 if(b.dataset.a=="e")editT(ev);
 else if(b.dataset.a=="l"){LK=LK==ev.id?null:ev.id;rp()}
 else if(b.dataset.a=="d"&&confirm("이 사건을 삭제할까요?"+(ev.ep?" 쓴 글도 함께 삭제됩니다.":""))){
  s.events=s.events.filter(function(x){return x!=ev});s.links=s.links.filter(function(l){return l.a!=ev.id&&l.b!=ev.id});
  Object.keys(S.texts).forEach(function(k){if(k.indexOf(ev.id+"-")==0)delete S.texts[k]});
  if(s==S.plot)S.plot=s;else P[P.length-1].sc=s;
  pers();rp();
 }
});
$("pb").onclick=function(){go(function(){P.pop()},-1)};
/* ---- 캐릭터 탭 ---- */
function rl(){
 var h="";
 S.rels.forEach(function(r,i){
  var A=S.chars.filter(function(c){return c.id==r.a})[0],Bc=S.chars.filter(function(c){return c.id==r.b})[0],a=$("c"+r.a),b=$("c"+r.b);if(!A||!Bc||!a||!b)return;
  var x1=A.x+105,y1=A.y+a.offsetHeight/2,x2=Bc.x+105,y2=Bc.y+b.offsetHeight/2,col=r.c||RC[r.t]||"#8a929e";
  h+='<line class="lk" data-i="'+i+'" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="4"/><text class="lk" data-i="'+i+'" x="'+(x1+x2)/2+'" y="'+(y1+y2)/2+'" fill="'+col+'" text-anchor="middle">'+esc(r.t)+'</text>';
 });
 $("csv").innerHTML=h;
}
function rg(){$("gl").innerHTML=S.groups.slice(1).map(function(g){return"<option>"+esc(g.n)+"</option>"}).join("")}
function grp(n){n=n.trim();if(!n)return 0;var i=-1;S.groups.forEach(function(g,k){if(g.n==n)i=k});if(i<0){S.groups.push({n:n,c:GP[S.groups.length%GP.length]});i=S.groups.length-1}return i}
function rc(){
 var h='<svg class="sv" id="csv"></svg>';
 S.chars.forEach(function(c){
  var g=S.groups[c.g]||S.groups[0];
  h+='<div class="ch'+(c.id==N?" new":"")+'" id="c'+c.id+'" style="left:'+c.x+'px;top:'+c.y+'px;--g:'+g.c+'"><div class="r1"><div class="av" data-a="img" style="background-image:url(\''+(c.img||"")+'\')">'+(c.img?"":"＋")+'</div><div class="r2"><input data-f="n" value="'+esc(c.n)+'" placeholder="이름"><div class="gr"><input data-f="gn" list="gl" value="'+(c.g?esc(g.n):"")+'" placeholder="소속 입력"><input type="color" data-f="gc" value="'+g.c+'"'+(c.g?"":" disabled")+' title="소속 색상"></div></div></div><textarea data-f="info" rows="3" placeholder="기본 정보 (나이, 직업, 성격…)">'+esc(c.info)+'</textarea><div class="bt"><button data-a="det">'+(c.open?"접기":"자세히")+'</button><button data-a="rel"'+(LC==c.id?' style="border-color:#2b2f36;background:#e3e5e8"':"")+'>관계 ⇢</button><button data-a="del">×</button></div>'+(c.open?'<div class="det"><b>'+esc(c.n||"캐릭터")+' 상세</b><textarea data-f="det" placeholder="외모, 과거, 능력, 비밀…">'+esc(c.det)+"</textarea></div>":"")+"</div>";
 });
 $("cw").innerHTML=h;N=0;rg();
 S.chars.forEach(function(c){
  var el=$("c"+c.id);
  drag(el,CB,function(){return{x:c.x,y:c.y}},function(x,y){c.x=x;c.y=y;el.style.left=x+"px";el.style.top=y+"px";rl()},function(){tapCh(c)},pers);
 });
 rl();
}
function tapCh(c){
 if(!LC||LC==c.id)return;var a=LC;LC=null;hint();
 ask({msg:"두 캐릭터의 관계 (직접 입력 가능)",list:Object.keys(RC),col:true,c:"#8a929e"},function(v,cl){S.rels.push({a:a,b:c.id,t:v,c:(cl=="#8a929e"&&RC[v])?RC[v]:cl});pers();rc()});
}
function cof(e){var c=e.target.closest(".ch");return c&&S.chars.filter(function(x){return"c"+x.id==c.id})[0]}
var CB=Board($("cv"),$("cw"),".ch,button,.lk,select",function(){if(LC){LC=null;hint();rc()}});
$("cw").addEventListener("input",function(e){
 var c=cof(e),f=e.target.dataset.f;if(!c||!f)return;
 if(f!="n"&&f!="info"&&f!="det")return;c[f]=e.target.value;pers();
 if(f=="n"&&c.open){var b=$("c"+c.id).querySelector(".det b");if(b)b.textContent=(c.n||"캐릭터")+" 상세"}
});
$("cw").addEventListener("change",function(e){
 var c=cof(e),f=e.target.dataset.f;if(!c)return;
 if(f=="gn"){c.g=grp(e.target.value);pers();rc()}
 else if(f=="gc"&&c.g){S.groups[c.g].c=e.target.value;pers();rc()}
});
$("cw").addEventListener("click",function(e){
 var l=e.target.closest(".lk");
 if(l){if(confirm("이 관계선을 삭제할까요?")){S.rels.splice(+l.dataset.i,1);pers();rl()}return}
 var c=cof(e),b=e.target.closest("button,.av");if(!c||!b)return;var a=b.dataset.a;
 if(a=="img"){$("fi").dataset.id=c.id;$("fi").click()}
 else if(a=="det"){c.open=!c.open;pers();rc()}
 else if(a=="rel"){LC=LC==c.id?null:c.id;hint();rc()}
 else if(a=="del"&&confirm("이 캐릭터를 삭제할까요?")){S.chars=S.chars.filter(function(x){return x!=c});S.rels=S.rels.filter(function(r){return r.a!=c.id&&r.b!=c.id});pers();rc()}
});
$("fi").onchange=function(){
 var f=this.files[0],id=+this.dataset.id;if(!f)return;this.value="";
 var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var cv=document.createElement("canvas");cv.width=cv.height=128;var m=Math.min(im.width,im.height);
  cv.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);
  var c=S.chars.filter(function(x){return x.id==id})[0];if(c){c.img=cv.toDataURL("image/jpeg",.75);pers();rc()}
 };im.src=r.result};r.readAsDataURL(f);
};
$("ac").onclick=function(){
 var vp=$("cv"),q=CB.pt(vp.getBoundingClientRect().left+vp.clientWidth/2,vp.getBoundingClientRect().top+vp.clientHeight/2),c={id:++S.u,x:Math.round(q[0]-105),y:Math.round(q[1]-100),n:"",g:0,info:"",det:"",img:"",open:false};
 for(var k=0;k<50&&S.chars.some(function(o){return Math.abs(o.x-c.x)<230&&Math.abs(o.y-c.y)<260});k++){c.x+=320}
 S.chars.push(c);N=c.id;pers();rc();
};
/* ---- 글 탭 ---- */
function eps(){var a=[];S.plot.events.slice().sort(function(x,y){return x.x-y.x}).forEach(function(e){for(var i=1;i<=(e.ep||0);i++)a.push({k:e.id+"-"+i,t:e.t+" · "+i+"화"})});return a}
function cnt(){var v=$("ta").value;$("cn").textContent=v.length.toLocaleString()+"자 (공백 제외 "+v.replace(/\s/g,"").length.toLocaleString()+"자)"}
function rw(){
 var a=eps(),cur=a.filter(function(x){return x.k==WK})[0];
 $("el").innerHTML=a.length?a.map(function(x){return'<div class="ei'+(x.k==WK?" on":"")+'" data-k="'+x.k+'">'+esc(x.t)+"</div>"}).join(""):'<p class="em">플롯 탭에서 사건을 만들고 화 수를 정하면 여기에 나타납니다.</p>';
 $("et").textContent=cur?cur.t:"화를 선택하세요";
 var mp=$("mp"),mh="";
 if(cur){var q=WK.split("-"),ev=S.plot.events.filter(function(x){return x.id==q[0]})[0],i=+q[1];
  if(ev&&ev.m)mh+='<div class="mt">'+esc(ev.t)+"</div>"+esc(ev.m);
  if(ev&&ev.sc)ev.sc.events.filter(function(x){return x.x>=(i-1)*800&&x.x<i*800}).sort(function(a,b){return a.x-b.x}).forEach(function(x){mh+='<div class="mt">▸ '+esc(x.t)+"</div>"+esc(x.m||"")});
 }
 mp.hidden=!mh;mp.innerHTML=mh;$("ta").disabled=!cur;$("ta").value=cur?S.texts[WK]||"":"";cnt();
}
function openW(k){WK=k;tab(2)}
$("el").addEventListener("click",function(e){var i=e.target.closest(".ei");if(i){WK=i.dataset.k;rw()}});
$("ta").addEventListener("input",function(){
 var ta=this,p=ta.selectionStart,m=ta.value.slice(0,p).match(/(^|\s)(대화|인용) $/);
 if(m)ta.setRangeText(m[2]=="대화"?'"':"「",p-3,p,"end");
 S.texts[WK]=ta.value;cnt();pers();
});
$("ta").addEventListener("beforeinput",function(e){
 if(e.inputType!="insertLineBreak")return;
 var ta=this,v=ta.value,p=ta.selectionStart,line=v.slice(v.lastIndexOf("\n",p-1)+1,p),c=null;
 if(/^\s*"/.test(line)&&(line.match(/"/g)||[]).length%2)c='"';else if(/^\s*「/.test(line)&&line.indexOf("」")<0)c="」";
 if(c){e.preventDefault();ta.setRangeText(c+"\n",p,p,"end");ta.dispatchEvent(new Event("input"))}
});
/* ---- 탭/시작 ---- */
var inited=0;
function tab(n){
 document.querySelectorAll(".pane").forEach(function(p,i){p.classList.toggle("on",i==n)});
 document.querySelectorAll("nav .it").forEach(function(b,i){b.classList.toggle("on",i==n)});
 $("nv").style.setProperty("--n",n);$("ind").style.setProperty("--n",n);CT=n;hint();
 if(n==0&&!(inited&1)){inited|=1;PB.v=rv();PB.ap()}
 if(n==1&&!(inited&2)){inited|=2;CB.v={x:40,y:70,k:1};CB.ap()}
 if(n==2)rw();
}
document.querySelectorAll("nav .it").forEach(function(b){b.onclick=function(){tab(+b.dataset.t)}});
function all(){rp();rc();rw();inited=0;tab(0)}
function show(on){$("login").hidden=on;$("nv").hidden=!on;$("app").hidden=!on}
function start(){
 show(true);try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(CK)||"{}"))}catch(e){}
 all();status("동기화 중…");pull();
}
$("login").onsubmit=async function(e){
 e.preventDefault();$("err").textContent="";
 var r=await sb.auth.signInWithPassword({email:$("email").value,password:$("pass").value});
 if(r.error){$("err").textContent="로그인 실패: 이메일 또는 비밀번호를 확인하세요.";return}
 start();
};
$("out").onclick=async function(){await sb.auth.signOut();try{localStorage.removeItem(CK)}catch(e){}S=blank();show(false)};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!$("app").hidden)pull()});
window.addEventListener("online",function(){if(!$("app").hidden)pull()});
sb.auth.getSession().then(function(r){if(r.data.session)start();else show(false)});
})();
</script>
